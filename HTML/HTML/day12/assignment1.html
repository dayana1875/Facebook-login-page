<!DOCTYPE html>

<head>

    <title>Chess Board</title>
    <style>
        .black{

        }
        .white{
            background:white;
        }
    </style>

<body>
    <table border="2px solid" style=height:"200px";width=:"200px"; cellspacing="0px" cellpadding="20px">
